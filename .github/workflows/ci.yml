name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mistune pygments
      - name: Test rendering
        run: |
          echo "# Hello" > /tmp/test.md
          python -m mdviewer /tmp/test.md --stdout | grep -q "<h1"
          echo "OK"

  build-deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot unzip python3-pip
      - name: Build .deb
        run: ./build_deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mdviewer-deb
          path: mdviewer_*.deb

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pyinstaller mistune pygments
      - name: Build .exe
        run: |
          pyinstaller --onefile --name mdviewer mdviewer/__main__.py
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: mdviewer-exe
          path: dist/mdviewer.exe

  release-artifacts:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build-deb, build-exe]
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: mdviewer-deb/mdviewer_*.deb
          asset_name: mdviewer_1.0.0-1_all.deb
          asset_content_type: application/vnd.debian.binary-package
